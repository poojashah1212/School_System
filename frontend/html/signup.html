<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SmartSchool</title>
    <link rel="stylesheet" href="../css/signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Background -->
    <div class="login-bg">
        <div class="bg-grid"></div>
        <div class="bg-glow glow-1"></div>
        <div class="bg-glow glow-2"></div>
        <div class="bg-glow glow-3"></div>
    </div>

    <!-- Login Card -->
    <div class="login-card">
        <!-- Logo -->
        <div class="login-logo">
            <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
            <span class="logo-text">Smart<span class="logo-accent">School</span></span>
        </div>

        <div class="login-header">
            <h1>Create Account</h1>
            <p>Join SmartSchool learning community</p>
        </div>
        
        <form class="login-form" id="signup-form" enctype="multipart/form-data">
            <input type="hidden" id="signup-role" name="role" value="teacher">
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="signup-userId">User ID</label>
                    <input type="text" id="signup-userId" name="userId" placeholder="Choose a user ID">
                </div>

                <div class="form-group">
                    <label for="signup-fullName">Full Name</label>
                    <input type="text" id="signup-fullName" name="fullName" placeholder="Your full name">
                </div>

                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" placeholder="Your email">
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="signup-password" name="password" placeholder="Create a password">
                        <button type="button" class="toggle-password" data-target="signup-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signup-timezone">Timezone</label>
                    <select id="signup-timezone" name="timezone">
                        <option value="">Select timezone</option>
                        <option value="Asia/Kolkata">India (IST)</option>
                        <option value="Asia/Tokyo">Japan (JST)</option>
                        <option value="Asia/Singapore">Singapore (SGT)</option>
                        <option value="America/New_York">USA (EST)</option>
                        <option value="Europe/London">UK (GMT)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="signup-city">City</label>
                    <input type="text" id="signup-city" name="city" placeholder="Your city">
                </div>

                <div class="form-group">
                    <label for="signup-state">State</label>
                    <input type="text" id="signup-state" name="state" placeholder="Your state">
                </div>

                <div class="form-group">
                    <label for="signup-age">Age</label>
                    <input type="number" id="signup-age" name="age" placeholder="Your age" min="1" max="120">
                </div>

                <div class="form-group">
                    <label for="signup-mobileNo">Mobile</label>
                    <input type="tel" id="signup-mobileNo" name="mobileNo" placeholder="Mobile number">
                </div>

                <div class="form-group">
                    <label for="signup-profileImage">Profile Image</label>
                    <input type="file" id="signup-profileImage" name="profileImage" accept="image/*">
                </div>
            </div>

            <button type="submit" class="login-btn">Create Account</button>
        </form>

        <div class="login-footer">
            <p>Already have an account? <a href="/login">Sign In</a></p>
        </div>
    </div>

    <div class="loading-overlay" id="loading">
        <div class="loader">
            <div class="loader-ring"></div>
        </div>
    </div>

    <div class="message-container" id="message-container"></div>

    <script src="../js/auth.js"></script>

</body>
</html>
